        <!-- Scripts -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js"></script>
        <script type="module">
            import { GolangGopher } from "./gopher.js"

            async function loadComponent(selector, file) {
                try {
                    const result = await fetch(file)

                    if (!result.ok) {
                        return
                    }

                    document.querySelector(selector).innerHTML = await result.text()
                } catch (error) {
                    console.error(`Error fetching ${file}:`, error)
                }
            }

            async function loadAllComponents() {
                await loadComponent('#hero-component', 'components/hero.html')
                await loadComponent('#nav-component', 'components/nav.html')
                await loadComponent('#education-stack-component', 'components/education_stack.html')
                await loadComponent('#repositories-component', 'components/repositories.html')
                await loadComponent('#art-component', 'components/art.html')
                await loadComponent('#diagrams-component', 'components/diagrams.html')
                await loadComponent('#networking-component', 'components/networking.html')
                await loadComponent('#security-component', 'components/security.html')
                await loadComponent('#footer-component', 'components/footer.html')

                try {
                    await import("./filter.js")
                    await import('./script.js')
                    
                    if (typeof window.initializePortfolio === 'function') {
                        await window.initializePortfolio()
                    }
                } catch (error) {
                    console.error('Error loading script.js:', error)
                }

                const canvas = document.getElementById("golang-canvas")
                
                if (canvas) {
                    new GolangGopher(canvas)
                }

                // Handle instant jump to target before revealing the page.
                const urlParams = new URLSearchParams(window.location.search)
                const targetId = urlParams.get('target')

                if (targetId) {
                    const targetElement = document.getElementById(targetId)

                    if (targetElement) {
                        targetElement.scrollIntoView({ behavior: 'auto', block: 'start' })
                    }
                }

                // Reveal the fully rendered, correctly scrolled page all at once.
                document.body.style.visibility = 'visible'
            }

            loadAllComponents();
        </script>
    </body>
